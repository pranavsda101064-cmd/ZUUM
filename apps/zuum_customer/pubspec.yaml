name: zuum_customer
description: "Zuum customer app — Old Bengaluru soul. New Bengaluru movement."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.3.4
  zuum_core:
    path: ../../packages/core
  zuum_design_system:
    path: ../../packages/design_system
  go_router: ^18.1.4
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/zuum_icon.png
  adaptive_icon_background: "#102A2C"
  adaptive_icon_foreground: assets/icon/zuum_icon.png
  remove_alpha_ios: true
