# Render FREE demo blueprint — no credit card required.
#
# Limitations (Render free tier):
#   - spins down after 15 min idle (~1 min cold start; WebSockets reconnect)
#   - ephemeral filesystem (KYC/POD uploads are lost on restart)
#   - free Postgres expires 30 days after creation
#   - no shell access: migrations + seed run on every boot via dockerCommand
#   - no Celery worker/beat (CELERY_EAGER=1; offer expiry is lazy)
#
# For the full production blueprint use `render.production.yaml` (Starter plans).
services:
  - type: web
    name: zuum-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    dockerCommand: "sh -c 'python manage.py migrate --noinput && python manage.py create_ops_user && python manage.py seed_production_demo && daphne -b 0.0.0.0 -p ${PORT:-8000} --proxy-headers config.asgi:application'"
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "0"
      - key: NUM_PROXIES
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: zuum-db
          property: connectionString
      - key: DB_SSL_MODE
        value: require
      - key: CELERY_EAGER
        value: "1"
      - key: ROUTING_PROVIDER
        value: valhalla
      - key: ROUTING_BASE_URL
        value: https://valhalla1.openstreetmap.de
      - key: ROUTING_TIMEOUT_MS
        value: "4500"
      - key: ROUTING_CACHE_TTL
        value: "300"
      - key: PHOTON_URL
        value: https://photon.komoot.io
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SEED_PASSWORD
        sync: false

databases:
  - name: zuum-db
    plan: free
    databaseName: zuum
