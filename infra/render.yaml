# Render blueprint — Zuum backend (Phase 2)
# Docs: https://render.com/docs/blueprint-spec
# Fill image/env values when the backend exists; kept as the deployment contract.

services:
  - type: web
    name: zuum-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: starter          # paid: WebSockets need a non-sleeping service
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zuum-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: zuum-redis
          type: redis
          property: connectionString

  - type: worker
    name: zuum-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    buildCommand: ""
    startCommand: celery -A config worker -l info
    plan: starter
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zuum-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: zuum-redis
          type: redis
          property: connectionString

  - type: cron
    name: zuum-beat
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    schedule: "*/5 * * * *"
    startCommand: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    plan: starter
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zuum-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: zuum-redis
          type: redis
          property: connectionString

databases:
  - name: zuum-db
    plan: starter          # PostGIS: enable extension in migrations
    databaseName: zuum

  - name: zuum-redis
    plan: starter
